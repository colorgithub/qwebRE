// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.0'
        classpath 'com.google.gms:google-services:4.3.15'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
    }
}

subprojects { project ->
    afterEvaluate {
        if (project.name == 'capacitor-android' && project.hasProperty('android')) {
            project.android {
                namespace 'com.getcapacitor.android'
            }
        }
        if (project.name == 'capacitor-cordova-android-plugins' && project.hasProperty('android')) {
            project.android {
                namespace 'capacitor.android.plugins'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
